name: Sync QQ Bot Docs

on:
  schedule:
    # Every Monday at 10:17 Asia/Shanghai (02:17 UTC).
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qq-bot-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Download and synchronize documentation
        run: python sync_qq_bot_docs.py --repo-root .

      - name: Commit documentation changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No documentation changes."
            exit 0
          fi

          DOC_VERSION="$(python -c 'import json; print(json.load(open(".github/qq-bot-docs-sync.json", encoding="utf-8"))["sourceVersion"])')"
          SYNC_DATE="$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: sync QQ bot documentation ${DOC_VERSION} (${SYNC_DATE})"
          git push
